<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Second Chance Rescue{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-icon" aria-hidden="true">🐾</span> Second Chance<span class="brand-small">Animal Rescue</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ url_for('dogs') }}" {% if request.endpoint == 'dogs' %}aria-current="page"{% endif %}>Available dogs</a>
      <a href="{{ url_for('cats') }}" {% if request.endpoint == 'cats' %}aria-current="page"{% endif %}>Available cats</a>
    </nav>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>Second Chance Animal Rescue</span><span>A little kindness. A new beginning.</span></footer>
</body>
</html>
